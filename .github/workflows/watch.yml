name: Hlídání bytů
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'config.json'
      - '.github/workflows/watch.yml'
  schedule:
    - cron: '0 9,14,19 * * *'
      timezone: Europe/Prague
  workflow_dispatch:
    inputs:
      test_notification:
        description: Poslat pouze testovací zprávu na WhatsApp
        type: boolean
        default: false
      dry_run:
        description: Jen kontrola, neposílat zprávy
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: rental-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Ověřit filtry
        run: python -m unittest -v
      - name: Zkontrolovat nabídky a upozornit
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
          DRY_RUN: ${{ inputs.dry_run || github.event_name == 'push' }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            python watch.py --test-notification
          elif [ "$DRY_RUN" = "true" ]; then
            python watch.py --dry-run
          else
            python watch.py
          fi
      - name: Uložit historii i po chybě doručení
        if: always()
        run: |
          git config user.name 'rental-watch[bot]'
          git config user.email 'rental-watch[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update rental watch history [skip ci]'
            git push
          fi
      - name: Uložit přehled kontroly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-check-${{ github.run_id }}
          path: |
            report.md
            report.json
          retention-days: 7
          if-no-files-found: ignore
